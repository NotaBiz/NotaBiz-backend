basePath: /api/v1
externalDocs:
  description: OpenAPI
  url: https://swagger.io/resources/open-api/
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: This is a sample server celler server.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Swagger Example API
  version: "1.0"
paths:
  /auth/google:
    get:
      description: Initiate OAuth2 login for the specified provider (e.g. google).
        Redirects the client to the provider's consent page.
      responses:
        "302":
          description: redirect
          schema:
            type: string
      summary: OAuth2 login redirect
      tags:
      - Auth
  /auth/google/callback:
    get:
      description: OAuth2 callback endpoint. Exchanges code for user info and performs
        login/registration. Returns 200 on success, 401 if not authorized, 500 on
        server error.
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: OAuth2 callback
      tags:
      - Auth
  /health:
    get:
      description: Returns status of application services (redis, database, rabbitmq).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Show health status
      tags:
      - Health
  /ping:
    get:
      description: Simple health check endpoint that returns "pong".
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Ping server
      tags:
      - Health
securityDefinitions:
  BasicAuth:
    type: basic
swagger: "2.0"
